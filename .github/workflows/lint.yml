name: Lint

# Фильтров по путям здесь намеренно нет. Эта проверка обязательная в правиле
# ветки main, а GitHub считает не запустившуюся обязательную проверку не
# «пропущенной», а «ещё не пришедшей»: PR навсегда зависает в Expected. Цена —
# лишние прогоны, поэтому ниже включена отмена устаревших.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root tooling
        # npm ci здесь падает: корневой package-lock.json собран на Windows и в
      # нём нет @emnapi/runtime, который на Linux требует @img/sharp-wasm32.
      # Пересобрать lock под Linux с этой машины нельзя, поэтому пока install.
      run: npm install

      - name: Build shared-lib
        run: npm run build --workspace=@izibuy/shared-lib

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Verify design tokens parity
        run: npm run verify:design-tokens

      - name: Package unit tests (contract + shared-lib)
        run: npm run test:packages

      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test
