name: Contract smoke

# Фильтров по путям здесь намеренно нет. Эта проверка обязательная в правиле
# ветки main, а GitHub считает не запустившуюся обязательную проверку не
# «пропущенной», а «ещё не пришедшей»: PR навсегда зависает в Expected. Цена —
# лишние прогоны, поэтому ниже включена отмена устаревших.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke tests
        run: npm test
