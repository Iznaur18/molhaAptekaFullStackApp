name: E2E Playwright

on:
  push:
    paths:
      - "client/**"
      - "server/**"
      - "contract/**"
      - ".github/workflows/e2e-playwright.yml"
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "contract/**"
      - ".github/workflows/e2e-playwright.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/molha_e2e_ci
      JWT_SECRET: e2e-ci-jwt-secret-minimum-32-characters-long
      FRONTEND_URL: http://127.0.0.1:5173
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install contract
        working-directory: contract
        run: npm install

      - name: Install server
        working-directory: server
        run: npm install

      - name: Apply migrations
        working-directory: server
        run: npm run migrate:apply

      - name: Install client
        working-directory: client
        run: npm install

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: client
        run: npm run test:e2e
