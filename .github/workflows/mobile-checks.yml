name: Mobile checks

on:
  push:
    paths:
      - "mobile/**"
      - "packages/**"
      - "contract/**"
      - ".github/workflows/mobile-checks.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "packages/**"
      - "contract/**"
      - ".github/workflows/mobile-checks.yml"

# `mobile/` не был покрыт ни одним workflow: правки уезжали в стор без единой
# автоматической проверки. `typecheck` пока НЕ включён — в mobile есть
# накопленные ошибки tsc; включить отдельной задачей, когда они разгребутся.
jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared-lib
        run: npm run build --workspace=@izibuy/shared-lib

      - name: ESLint (mobile)
        working-directory: mobile
        run: npx eslint .

      - name: Mobile unit tests
        working-directory: mobile
        run: |
          npm run test:product-card-gallery
          npm run test:screen-layout
          npm run test:screen-content-layout
          npm run test:product-detail-chrome
          npm run test:product-detail-keyboard
          npm run test:home-catalog-search-row
          npm run test:cart-line-selection
          npm run test:price-offer-api-parity
          npm run test:shared-lib-metro-resolve
