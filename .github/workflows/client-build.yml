name: Client build & tests

# Фильтров по путям здесь намеренно нет. Эта проверка обязательная в правиле
# ветки main, а GitHub считает не запустившуюся обязательную проверку не
# «пропущенной», а «ещё не пришедшей»: PR навсегда зависает в Expected. Цена —
# лишние прогоны, поэтому ниже включена отмена устаревших.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Та же мажорная версия, что на боевом сервере (v20.20.2).
          node-version: "20"

      # Ставим ИЗ КОРНЯ, а не внутри client. client — воркспейс, и установка
      # внутри него сметает корневые devDependencies: postinstall тут же
      # падает с «patch-package: not found». Корневая установка заодно
      # разрешает file:-зависимости на contract и shared-lib.
      - name: Install workspace dependencies
        run: npm install

      - name: Build shared-lib
        run: npm run build --workspace=@izibuy/shared-lib

      - name: Client unit tests
        run: npm test --workspace=client

      - name: Production build
        run: npm run build --workspace=client
