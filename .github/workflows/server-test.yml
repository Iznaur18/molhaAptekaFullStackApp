name: Server tests

# Фильтров по путям здесь намеренно нет. Эта проверка обязательная в правиле
# ветки main, а GitHub считает не запустившуюся обязательную проверку не
# «пропущенной», а «ещё не пришедшей»: PR навсегда зависает в Expected. Цена —
# лишние прогоны, поэтому ниже включена отмена устаревших.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Та же мажорная версия, что на боевом сервере (v20.20.2).
          node-version: "20"

      - name: Install dependencies
        # ci, а не install: у server свой package-lock.json, и тесты должны
        # идти на тех же версиях зависимостей, что уезжают на прод.
        run: npm ci

      - name: Run tests
        run: npm test
