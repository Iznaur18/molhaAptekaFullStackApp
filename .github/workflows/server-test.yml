name: Server tests

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-test.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
