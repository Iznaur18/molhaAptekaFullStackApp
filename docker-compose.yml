# LOCAL DEV / CI ONLY — не деплоить на VPS и не использовать как production Mongo.
# Без auth намеренно: удобный localhost-flow (`npm run mongo:up`).
# Production: MongoDB Atlas (mongodb+srv с user/password) — см. server/.env.production.example
# и server/docs/production-checklist.md § MongoDB.
services:
  mongo:
    image: mongo:7
    container_name: gitorg-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - gitorg_mongo_data:/data/db
    restart: unless-stopped

volumes:
  gitorg_mongo_data:
